name: Deploy on Docker Host

on:
  workflow_run:
    workflows:
      - Build and Push Docker Image
    types:
      - completed

env:
  IMAGE_NAME: ketsrana866/docker
  CONTAINER_NAME: docker-container

jobs:
  deploy:
    runs-on: [self-hosted, linux]

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_TOKEN}}

      - name: Pull latest image from Docker Hub
        run: docker pull $IMAGE_NAME:latest

      - name: Stop old container if running
        run: docker stop $CONTAINER_NAME || true

      - name: Remove old container if exists
        run: docker rm $CONTAINER_NAME || true

      - name: Run new container
        run: |
          docker run -d \
            --name $CONTAINER_NAME \
            -p 5000:5000 \
            $IMAGE_NAME:latest

      - name: Check running container
        run: docker ps
